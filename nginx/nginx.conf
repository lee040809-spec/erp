user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off; # 隐藏版本号，更安全

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings
    ##
    # 建议只保留 TLSv1.2 和 TLSv1.3，TLSv1 和 1.1 已不安全
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    ##
    # Logging Settings
    ##
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    ##
    # Gzip Settings
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/atom+xml image/svg+xml;

    ##
    # Virtual Host Configs
    ##
    # 注意：如果下面定义了 server 块，建议注释掉 include sites-enabled/* 避免冲突
    # include /etc/nginx/conf.d/*.conf;
    # include /etc/nginx/sites-enabled/*;

    # ==========================================
    # 你的 ERP 项目配置
    # ==========================================
    server {
        listen 80;
        server_name localhost; # 如果有域名，改为你的域名，例如: example.com

        # 前端静态文件根目录 (请确保该目录存在且权限正确)
        root /var/www/erp;
        index index.html;

        # SPA 路由支持 (Vue/React 刷新 404 问题)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API 代理到 Go 后端 (假设 Go 运行在 28080 端口)
        location /api {
            proxy_pass http://127.0.0.1:28080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 可选：增加超时时间，防止长连接断开
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 静态资源缓存 (针对 js, css, 图片等)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off; # 静态资源不记录日志，节省磁盘
        }

        # 专属日志文件
        access_log /var/log/nginx/erp_access.log;
        error_log /var/log/nginx/erp_error.log;
    }
}